<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unipulse | Login & Sign Up</title>
    <meta name="description"
        content="Login or create an account to access personalized college recommendations on Unipulse.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #667eea;
            --primary-dark: #5a6fd8;
            --secondary: #764ba2;
            --accent: #f093fb;
            --success: #4ecdc4;
            --warning: #ffe066;
            --danger: #ff6b6b;
            --dark: #1a202c;
            --gray: #718096;
            --white: #ffffff;
            --light: #f8fafc;
            --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            --shadow-lg: 0 15px 40px rgba(0, 0, 0, 0.2);
            --border-radius: 12px;
            --border-radius-lg: 20px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: var(--gradient-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            overflow-x: hidden;
        }

        /* Animated background blobs */
        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            z-index: 0;
            animation: float 8s ease-in-out infinite alternate;
        }

        body::before {
            width: 500px;
            height: 500px;
            background: var(--accent);
            top: -100px;
            right: -100px;
        }

        body::after {
            width: 400px;
            height: 400px;
            background: var(--success);
            bottom: -100px;
            left: -100px;
            animation-delay: 2s;
        }

        @keyframes float {
            0% {
                transform: translate(0, 0) scale(1);
            }

            100% {
                transform: translate(30px, -30px) scale(1.08);
            }
        }

        /* Auth Container */
        .auth-container {
            width: 100%;
            max-width: 460px;
            position: relative;
            z-index: 1;
        }

        /* Logo Header */
        .auth-logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-logo .logo-icon {
            width: 72px;
            height: 72px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: white;
            margin-bottom: 1rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            transition: var(--transition);
        }

        .auth-logo .logo-icon:hover {
            transform: scale(1.05) rotate(2deg);
        }

        .auth-logo h1 {
            font-size: 2rem;
            font-weight: 800;
            color: white;
            letter-spacing: -0.5px;
        }

        .auth-logo p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1rem;
            margin-top: 0.3rem;
        }

        /* Auth Card */
        .auth-card {
            background: var(--white);
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            animation: cardSlideUp 0.5s ease;
        }

        @keyframes cardSlideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Tab Switcher */
        .auth-tabs {
            display: flex;
            background: var(--light);
            border-bottom: 2px solid #e2e8f0;
        }

        .auth-tab {
            flex: 1;
            padding: 1rem;
            text-align: center;
            font-weight: 600;
            font-size: 1rem;
            color: var(--gray);
            background: none;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            font-family: 'Inter', sans-serif;
        }

        .auth-tab::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--primary);
            transform: scaleX(0);
            transition: transform 0.3s ease;
            border-radius: 3px 3px 0 0;
        }

        .auth-tab.active {
            color: var(--primary);
        }

        .auth-tab.active::after {
            transform: scaleX(1);
        }

        .auth-tab:hover {
            color: var(--primary);
        }

        /* Auth Forms */
        .auth-body {
            padding: 2rem;
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--dark);
            margin-bottom: 0.4rem;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i.field-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0aec0;
            font-size: 0.95rem;
            transition: var(--transition);
            pointer-events: none;
        }

        .input-wrapper input {
            width: 100%;
            padding: 13px 16px 13px 44px;
            border: 2px solid #e2e8f0;
            border-radius: var(--border-radius);
            font-size: 0.95rem;
            color: var(--dark);
            font-family: 'Inter', sans-serif;
            transition: var(--transition);
            outline: none;
            background: var(--white);
        }

        .input-wrapper input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .input-wrapper input:focus~i.field-icon {
            color: var(--primary);
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #a0aec0;
            cursor: pointer;
            font-size: 0.95rem;
            transition: var(--transition);
            padding: 4px;
        }

        .password-toggle:hover {
            color: var(--primary);
        }

        /* Strength Meter */
        .password-strength {
            margin-top: 8px;
            display: none;
        }

        .password-strength.visible {
            display: block;
        }

        .strength-bars {
            display: flex;
            gap: 4px;
            margin-bottom: 4px;
        }

        .strength-bar {
            flex: 1;
            height: 4px;
            border-radius: 2px;
            background: #e2e8f0;
            transition: var(--transition);
        }

        .strength-bar.active.weak {
            background: var(--danger);
        }

        .strength-bar.active.medium {
            background: var(--warning);
        }

        .strength-bar.active.strong {
            background: var(--success);
        }

        .strength-text {
            font-size: 0.78rem;
            font-weight: 500;
        }

        .strength-text.weak {
            color: var(--danger);
        }

        .strength-text.medium {
            color: #e67e22;
        }

        .strength-text.strong {
            color: var(--success);
        }

        /* Error/Success Messages */
        .auth-message {
            padding: 12px 16px;
            border-radius: var(--border-radius);
            font-size: 0.9rem;
            display: none;
            align-items: center;
            gap: 10px;
            margin-bottom: 1.25rem;
            animation: shakeX 0.4s ease-in-out;
        }

        .auth-message.visible {
            display: flex;
        }

        .auth-message.error {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid rgba(255, 107, 107, 0.3);
            color: var(--danger);
        }

        .auth-message.success {
            background: rgba(78, 205, 196, 0.1);
            border: 1px solid rgba(78, 205, 196, 0.3);
            color: #219a8c;
        }

        @keyframes shakeX {

            0%,
            100% {
                transform: translateX(0);
            }

            20% {
                transform: translateX(-6px);
            }

            40% {
                transform: translateX(6px);
            }

            60% {
                transform: translateX(-4px);
            }

            80% {
                transform: translateX(4px);
            }
        }

        /* Submit Button */
        .auth-btn {
            width: 100%;
            padding: 14px;
            background: var(--gradient-primary);
            border: none;
            border-radius: var(--border-radius);
            color: white;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: 'Inter', sans-serif;
            margin-top: 0.5rem;
        }

        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .auth-btn:active {
            transform: translateY(0);
        }

        .auth-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .auth-btn .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        .auth-btn.loading .spinner {
            display: inline-block;
        }

        .auth-btn.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Divider */
        .auth-divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 1.5rem 0;
            color: var(--gray);
            font-size: 0.85rem;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e2e8f0;
        }

        /* Social Login */
        .social-login {
            display: flex;
            gap: 0.75rem;
        }

        .social-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: var(--border-radius);
            background: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--dark);
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
        }

        .social-btn:hover {
            border-color: var(--primary);
            background: rgba(102, 126, 234, 0.04);
            transform: translateY(-1px);
        }

        .social-btn .fa-google {
            color: #ea4335;
        }

        .social-btn .fa-github {
            color: #333;
        }

        /* Remember + Forgot */
        .form-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .remember-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: var(--gray);
            cursor: pointer;
        }

        .remember-label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .forgot-link {
            font-size: 0.9rem;
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
        }

        .forgot-link:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        /* Terms */
        .terms-text {
            font-size: 0.82rem;
            color: var(--gray);
            text-align: center;
            margin-top: 1rem;
            line-height: 1.5;
        }

        .terms-text a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .terms-text a:hover {
            text-decoration: underline;
        }

        /* Footer */
        .auth-footer {
            text-align: center;
            margin-top: 1.5rem;
        }

        .auth-footer a {
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
        }

        .auth-footer a:hover {
            color: white;
        }

        /* Responsive */
        @media (max-width: 576px) {
            body {
                padding: 1rem;
            }

            .auth-card {
                border-radius: 16px;
            }

            .auth-body {
                padding: 1.5rem;
            }

            .auth-logo h1 {
                font-size: 1.6rem;
            }

            .social-login {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="auth-container">
        <!-- Logo -->
        <div class="auth-logo">
            <div class="logo-icon">
                <i class="fas fa-graduation-cap"></i>
            </div>
            <h1>Unipulse</h1>
            <p>Find Your Dream College</p>
        </div>

        <!-- Auth Card -->
        <div class="auth-card">
            <!-- Tabs -->
            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login" id="tab-login">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
                <button class="auth-tab" data-tab="signup" id="tab-signup">
                    <i class="fas fa-user-plus"></i> Sign Up
                </button>
            </div>

            <div class="auth-body">
                <!-- ===== LOGIN FORM ===== -->
                <form class="auth-form active" id="login-form" onsubmit="return false;">
                    <div class="auth-message error" id="login-error">
                        <i class="fas fa-exclamation-circle"></i>
                        <span id="login-error-text"></span>
                    </div>
                    <div class="auth-message success" id="login-success">
                        <i class="fas fa-check-circle"></i>
                        <span id="login-success-text"></span>
                    </div>

                    <div class="form-group">
                        <label for="login-email">Email Address</label>
                        <div class="input-wrapper">
                            <input type="email" id="login-email" placeholder="you@example.com" required>
                            <i class="fas fa-envelope field-icon"></i>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <div class="input-wrapper">
                            <input type="password" id="login-password" placeholder="Enter your password" required>
                            <i class="fas fa-lock field-icon"></i>
                            <button type="button" class="password-toggle"
                                onclick="togglePassword('login-password', this)">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="remember-label">
                            <input type="checkbox" id="login-remember"> Remember me
                        </label>
                        <a href="#" class="forgot-link" onclick="showForgotPassword(); return false;">Forgot
                            password?</a>
                    </div>

                    <button type="submit" class="auth-btn" id="login-btn">
                        <div class="spinner"></div>
                        <span class="btn-text"><i class="fas fa-sign-in-alt"></i> Login</span>
                    </button>

                    <div class="auth-divider">or continue with</div>

                    <div class="social-login">
                        <button type="button" class="social-btn" onclick="socialLogin('google')">
                            <i class="fab fa-google"></i> Google
                        </button>
                        <button type="button" class="social-btn" onclick="socialLogin('github')">
                            <i class="fab fa-github"></i> GitHub
                        </button>
                    </div>
                </form>

                <!-- ===== SIGNUP FORM ===== -->
                <form class="auth-form" id="signup-form" onsubmit="return false;">
                    <div class="auth-message error" id="signup-error">
                        <i class="fas fa-exclamation-circle"></i>
                        <span id="signup-error-text"></span>
                    </div>
                    <div class="auth-message success" id="signup-success">
                        <i class="fas fa-check-circle"></i>
                        <span id="signup-success-text"></span>
                    </div>

                    <div class="form-group">
                        <label for="signup-name">Full Name</label>
                        <div class="input-wrapper">
                            <input type="text" id="signup-name" placeholder="John Doe" required>
                            <i class="fas fa-user field-icon"></i>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="signup-email">Email Address</label>
                        <div class="input-wrapper">
                            <input type="email" id="signup-email" placeholder="you@example.com" required>
                            <i class="fas fa-envelope field-icon"></i>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="signup-phone">Phone Number</label>
                        <div class="input-wrapper">
                            <input type="tel" id="signup-phone" placeholder="+91 98765 43210"
                                pattern="[0-9+\s\-]{10,15}">
                            <i class="fas fa-phone field-icon"></i>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="signup-password">Password</label>
                        <div class="input-wrapper">
                            <input type="password" id="signup-password" placeholder="Create a strong password" required
                                minlength="6">
                            <i class="fas fa-lock field-icon"></i>
                            <button type="button" class="password-toggle"
                                onclick="togglePassword('signup-password', this)">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div class="password-strength" id="password-strength">
                            <div class="strength-bars">
                                <div class="strength-bar" id="str-bar-1"></div>
                                <div class="strength-bar" id="str-bar-2"></div>
                                <div class="strength-bar" id="str-bar-3"></div>
                                <div class="strength-bar" id="str-bar-4"></div>
                            </div>
                            <span class="strength-text" id="strength-text"></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="signup-confirm">Confirm Password</label>
                        <div class="input-wrapper">
                            <input type="password" id="signup-confirm" placeholder="Confirm your password" required
                                minlength="6">
                            <i class="fas fa-shield-alt field-icon"></i>
                        </div>
                    </div>

                    <button type="submit" class="auth-btn" id="signup-btn">
                        <div class="spinner"></div>
                        <span class="btn-text"><i class="fas fa-user-plus"></i> Create Account</span>
                    </button>

                    <p class="terms-text">
                        By signing up, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy
                            Policy</a>
                    </p>
                </form>
            </div>
        </div>

        <!-- Footer -->
        <div class="auth-footer">
            <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Unipulse</a>
        </div>
    </div>

    <script>
        (function () {
            'use strict';

            const API_BASE = '/api';
            const SESSION_KEY = 'unipulse_user_session';
            const MAX_ATTEMPTS = 5;
            const LOCKOUT_MS = 30000;
            let loginAttempts = 0;
            let lockoutUntil = 0;

            // ==================== INIT ====================
            document.addEventListener('DOMContentLoaded', function () {
                const session = getSession();
                if (session) {
                    window.location.href = 'index.html';
                    return;
                }

                document.querySelectorAll('.auth-tab').forEach(function (tab) {
                    tab.addEventListener('click', function () {
                        switchTab(this.dataset.tab);
                    });
                });

                document.getElementById('login-form').addEventListener('submit', handleLogin);
                document.getElementById('login-btn').addEventListener('click', handleLogin);
                document.getElementById('signup-form').addEventListener('submit', handleSignup);
                document.getElementById('signup-btn').addEventListener('click', handleSignup);

                document.getElementById('signup-password').addEventListener('input', function () {
                    updatePasswordStrength(this.value);
                });

                if (window.location.hash === '#signup') {
                    switchTab('signup');
                }
            });

            // ==================== TAB SWITCHING ====================
            function switchTab(tab) {
                document.querySelectorAll('.auth-tab').forEach(function (t) { t.classList.remove('active'); });
                document.querySelectorAll('.auth-form').forEach(function (f) { f.classList.remove('active'); });
                document.querySelector('.auth-tab[data-tab="' + tab + '"]').classList.add('active');
                document.getElementById(tab + '-form').classList.add('active');
                hideMessages();
            }

            // ==================== LOGIN ====================
            async function handleLogin(e) {
                if (e) e.preventDefault();
                hideMessages();

                if (Date.now() < lockoutUntil) {
                    var remaining = Math.ceil((lockoutUntil - Date.now()) / 1000);
                    showError('login', 'Too many failed attempts. Please wait ' + remaining + ' seconds.');
                    return;
                }

                var email = document.getElementById('login-email').value.trim().toLowerCase();
                var password = document.getElementById('login-password').value;

                if (!email || !password) {
                    showError('login', 'Please enter your email and password.');
                    return;
                }
                if (!isValidEmail(email)) {
                    showError('login', 'Please enter a valid email address.');
                    return;
                }

                var btn = document.getElementById('login-btn');
                btn.classList.add('loading');
                btn.disabled = true;

                try {
                    var res = await fetch(API_BASE + '/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: email, password: password })
                    });
                    var data = await res.json();

                    btn.classList.remove('loading');
                    btn.disabled = false;

                    if (!res.ok) {
                        loginAttempts++;
                        checkLockout('login');
                        var left = MAX_ATTEMPTS - loginAttempts;
                        showError('login', data.error + (left > 0 ? ' ' + left + ' attempt(s) remaining.' : ''));
                        return;
                    }

                    // Login success — save session
                    loginAttempts = 0;
                    var sessionData = {
                        id: data.user.id,
                        name: data.user.name,
                        email: data.user.email,
                        phone: data.user.phone || '',
                        loggedInAt: new Date().toISOString()
                    };

                    if (document.getElementById('login-remember').checked) {
                        localStorage.setItem(SESSION_KEY, JSON.stringify(sessionData));
                    } else {
                        sessionStorage.setItem(SESSION_KEY, JSON.stringify(sessionData));
                    }

                    showSuccess('login', 'Login successful! Redirecting...');
                    setTimeout(function () {
                        window.location.href = 'index.html';
                    }, 1000);

                } catch (err) {
                    btn.classList.remove('loading');
                    btn.disabled = false;
                    showError('login', 'Network error. Please make sure the server is running.');
                }
            }

            function checkLockout(form) {
                if (loginAttempts >= MAX_ATTEMPTS) {
                    lockoutUntil = Date.now() + LOCKOUT_MS;
                    showError(form, 'Account locked for 30 seconds due to too many failed attempts.');
                }
            }

            // ==================== SIGNUP ====================
            async function handleSignup(e) {
                if (e) e.preventDefault();
                hideMessages();

                var name = document.getElementById('signup-name').value.trim();
                var email = document.getElementById('signup-email').value.trim().toLowerCase();
                var phone = document.getElementById('signup-phone').value.trim();
                var password = document.getElementById('signup-password').value;
                var confirm = document.getElementById('signup-confirm').value;

                if (!name || name.length < 2) {
                    showError('signup', 'Please enter your full name (at least 2 characters).');
                    return;
                }
                if (!isValidEmail(email)) {
                    showError('signup', 'Please enter a valid email address.');
                    return;
                }
                if (password.length < 6) {
                    showError('signup', 'Password must be at least 6 characters long.');
                    return;
                }
                if (password !== confirm) {
                    showError('signup', 'Passwords do not match.');
                    return;
                }

                var btn = document.getElementById('signup-btn');
                btn.classList.add('loading');
                btn.disabled = true;

                try {
                    var res = await fetch(API_BASE + '/auth/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: name, email: email, phone: phone, password: password })
                    });
                    var data = await res.json();

                    btn.classList.remove('loading');
                    btn.disabled = false;

                    if (!res.ok) {
                        showError('signup', data.error || 'Registration failed.');
                        return;
                    }

                    showSuccess('signup', 'Account created successfully! Redirecting to login...');

                    setTimeout(function () {
                        switchTab('login');
                        document.getElementById('login-email').value = email;
                        showSuccess('login', 'Account created! Please enter your password to login.');
                    }, 1500);

                } catch (err) {
                    btn.classList.remove('loading');
                    btn.disabled = false;
                    showError('signup', 'Network error. Please make sure the server is running.');
                }
            }

            // ==================== PASSWORD STRENGTH ====================
            function updatePasswordStrength(password) {
                var meter = document.getElementById('password-strength');
                var textEl = document.getElementById('strength-text');
                var bars = [
                    document.getElementById('str-bar-1'),
                    document.getElementById('str-bar-2'),
                    document.getElementById('str-bar-3'),
                    document.getElementById('str-bar-4')
                ];

                if (!password) { meter.classList.remove('visible'); return; }
                meter.classList.add('visible');

                var score = 0;
                if (password.length >= 6) score++;
                if (password.length >= 10) score++;
                if (/[A-Z]/.test(password) && /[a-z]/.test(password)) score++;
                if (/[0-9]/.test(password)) score++;
                if (/[^A-Za-z0-9]/.test(password)) score++;

                var level, levelClass, text;
                if (score <= 1) { level = 1; levelClass = 'weak'; text = 'Weak password'; }
                else if (score <= 2) { level = 2; levelClass = 'weak'; text = 'Fair password'; }
                else if (score <= 3) { level = 3; levelClass = 'medium'; text = 'Good password'; }
                else { level = 4; levelClass = 'strong'; text = 'Strong password'; }

                bars.forEach(function (bar, i) {
                    bar.className = 'strength-bar';
                    if (i < level) bar.classList.add('active', levelClass);
                });
                textEl.className = 'strength-text ' + levelClass;
                textEl.textContent = text;
            }

            // ==================== HELPERS ====================
            function getSession() {
                try {
                    var s = sessionStorage.getItem(SESSION_KEY) || localStorage.getItem(SESSION_KEY);
                    return s ? JSON.parse(s) : null;
                } catch (e) { return null; }
            }

            function isValidEmail(email) {
                return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
            }

            function showError(form, msg) {
                var el = document.getElementById(form + '-error');
                document.getElementById(form + '-error-text').textContent = msg;
                el.classList.add('visible');
                el.style.animation = 'none';
                void el.offsetWidth;
                el.style.animation = '';
            }

            function showSuccess(form, msg) {
                var el = document.getElementById(form + '-success');
                document.getElementById(form + '-success-text').textContent = msg;
                el.classList.add('visible');
            }

            function hideMessages() {
                document.querySelectorAll('.auth-message').forEach(function (m) {
                    m.classList.remove('visible');
                });
            }

            // ==================== GLOBAL FUNCTIONS ====================
            window.togglePassword = function (inputId, btn) {
                var input = document.getElementById(inputId);
                var icon = btn.querySelector('i');
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.className = 'fas fa-eye-slash';
                } else {
                    input.type = 'password';
                    icon.className = 'fas fa-eye';
                }
            };

            window.showForgotPassword = function () {
                alert('Password reset functionality would send a reset link to your registered email.');
            };

            window.socialLogin = function (provider) {
                alert(provider.charAt(0).toUpperCase() + provider.slice(1) + ' login requires OAuth setup on the server.');
            };
        })();
    </script>
</body>
